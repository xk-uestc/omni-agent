<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>云数智询 Cloud Data Intelligence — 多模态数据驱动的可解释精准问数/问答智能体</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./agent-workspace.css">
  <link rel="stylesheet" href="./agent-results.css">
  <link rel="stylesheet" href="./agent-timeline-product.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div id="app" class="workspace-container">
    <!-- 左侧导航栏：品牌、会话列表与多轮记忆槽位 (branch: memory) -->
    <aside class="sidebar">
      <div class="brand-header">
        <div class="brand-logo-wrap">
          <img src="./brand-logo.png" alt="云数智询 Cloud Data Intelligence" class="brand-logo-img">
        </div>
        <span class="verify-pill cross-source" style="font-size:10.5px;">赛题八</span>
      </div>

      <button type="button" id="new-chat-btn" class="new-chat-btn">
        <span>＋ 新建多模态问数会话</span>
        <span class="kbd-hint">⌘K</span>
      </button>

      <div class="sidebar-section-label">
        <span>典型赛题评测场景会话</span>
        <span>4 组</span>
      </div>
      <div id="session-picker" class="session-list"></div>

      <!-- Memory 分支核心特性：多轮对话短期与长期记忆可视化 -->
      <div class="sidebar-memory-panel">
        <div class="memory-header">
          <div class="memory-title">
            <span class="memory-dot"></span>
            <span>多轮上下文记忆 (Memory)</span>
          </div>
          <span id="memory-turn-badge" style="font-size:10.5px;color:var(--accent-primary);font-weight:600;">第 1 轮</span>
        </div>
        <div id="sidebar-memory-slots" class="memory-slots"></div>
      </div>

      <div class="sidebar-footer">
        <span>中电云计算 · 高校ICT大赛</span>
        <span style="font-family:var(--font-mono);font-size:11px;">branch: ui-update</span>
      </div>
    </aside>

    <!-- 中央主工作区：自然对话流 + 底部悬浮输入框 -->
    <main class="main-content">
      <header class="top-bar">
        <div class="top-bar-left">
          <button type="button" id="toggle-sidebar-btn" class="icon-btn" title="收起/展开侧边栏">☰ 导航</button>
          <div id="connection-status" class="status-badge demo" title="点击配置真实后端 Agent API 地址">
            <span class="dot"></span>
            <span>系统连接检测中...</span>
          </div>
        </div>

        <div class="top-bar-right">
          <button type="button" id="open-api-modal-btn" class="icon-btn">⚡ 接入真实 API</button>
          <button type="button" id="theme-toggle-btn" class="icon-btn">🌙 深色外观</button>
          <button type="button" id="toggle-inspector-btn" class="icon-btn active">📑 可解释溯源台</button>
        </div>
      </header>

      <!-- 对话与问数结果展示流 -->
      <section id="results-scroll-area" class="results-display">
        <div id="agent-results-container" class="conversation-stream"></div>
      </section>

      <!-- 底部悬浮输入区 (Apple / Claude / ChatGPT 风格) -->
      <section class="query-section">
        <div class="composer-container">
          <div class="scenario-pills-bar">
            <button type="button" class="scenario-pill" data-scenario="cross_source">
              <span class="pill-tag">跨源融合+公式</span>
              <span>对比“帝都”智算项目营收与报告预期增长率</span>
            </button>
            <button type="button" class="scenario-pill" data-scenario="clarification">
              <span class="pill-tag">中级3·主动澄清</span>
              <span>查询今年各部门增长率排名（测试维度缺失澄清）</span>
            </button>
            <button type="button" class="scenario-pill" data-scenario="complex_sql">
              <span class="pill-tag">中级4&5·多表SQL</span>
              <span>华北与华东政务云复购率超80%客户及客单价</span>
            </button>
            <button type="button" class="scenario-pill" data-scenario="ocr_rag">
              <span class="pill-tag">中级6-9·扫描件RAG</span>
              <span>扫描版白皮书“權限隔離”目录重构与安全公式</span>
            </button>
          </div>

          <div class="input-box-wrapper">
            <textarea id="query-input" rows="2" placeholder="输入自然语言问数或知识库问题（支持业务别名如“帝都”、跨表 SQL 查询、PDF 公式验算及多轮追问）..."></textarea>
            <div class="composer-toolbar">
              <div class="composer-tools-left">
                <button type="button" class="tool-chip active" data-mode="auto">✨ 智能多源协同 (Auto)</button>
                <button type="button" class="tool-chip" data-mode="nl2sql">🗄️ 结构化问数 (NL2SQL)</button>
                <button type="button" class="tool-chip" data-mode="rag">📄 知识库与公式 (RAG)</button>
                <button type="button" class="tool-chip" data-mode="clarify">🛡️ 严格语义澄清校验</button>
              </div>
              <button type="button" id="submit-btn" class="primary-btn">
                <span>发送询问</span>
                <span>↑</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 右侧可解释性溯源与执行审计工作台 (Claude Artifacts / NotebookLM 风格) -->
    <aside class="inspector-drawer">
      <div class="inspector-header">
        <div class="inspector-title">
          <span>🔬 可解释性溯源与执行审计</span>
        </div>
        <span style="font-size:11px;color:var(--text-muted);">有迹可循</span>
      </div>

      <div class="inspector-tabs">
        <button type="button" class="inspector-tab active" data-tab="sql">SQL与图表</button>
        <button type="button" class="inspector-tab" data-tab="schema">Schema拓扑</button>
        <button type="button" class="inspector-tab" data-tab="rag">文档与公式</button>
        <button type="button" class="inspector-tab" data-tab="memory">多轮记忆</button>
      </div>

      <div id="inspector-body" class="inspector-body"></div>
    </aside>
  </div>

  <!-- 接入真实 Agent API 配置弹窗 -->
  <div id="api-settings-modal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,0.45);backdrop-filter:blur(4px);z-index:100;align-items:center;justify-content:center;padding:16px;">
    <div style="background:var(--bg-surface);border:1px solid var(--border-strong);border-radius:16px;max-width:460px;width:100%;padding:22px;box-shadow:var(--shadow-md);display:flex;flex-direction:column;gap:14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h3 style="font-size:16px;font-weight:600;">⚡ 接入真实 Agent 后端 API</h3>
        <button type="button" id="close-api-modal-btn" class="icon-btn" style="height:28px;">✕</button>
      </div>
      <p style="font-size:12.5px;color:var(--text-secondary);line-height:1.55;">
        当前界面完全兼容 <code>ict-track8/backend</code> 接口规范（<code>/health</code>、<code>/api/v1/nl2sql/schema</code>、<code>/api/v1/agent/query</code>）。填入您的后端地址或 API Key 后即可直接联调真实模型。
      </p>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:12px;font-weight:600;color:var(--text-secondary);">后端服务地址 (ICT8_API_BASE)</label>
        <input id="api-base-input" type="text" value="http://localhost:8000" style="padding:9px 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-surface-subtle);font-family:var(--font-mono);font-size:12.5px;">
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;">
        <label style="font-size:12px;font-weight:600;color:var(--text-secondary);">API Key / Bearer Token (可选)</label>
        <input id="api-key-input" type="password" placeholder="sk-..." style="padding:9px 12px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg-surface-subtle);font-family:var(--font-mono);font-size:12.5px;">
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--text-secondary);cursor:pointer;">
        <input id="api-stream-checkbox" type="checkbox" checked>
        <span>启用 SSE 流式推理链路推送 (stream=true)</span>
      </label>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:6px;">
        <button type="button" id="save-api-settings-btn" class="primary-btn">保存并测试连接</button>
      </div>
    </div>
  </div>

  <!-- 模块脚本 -->
  <script src="./schema-svg.js"></script>
  <script src="./conversation-context.js"></script>
  <script src="./conversation-session.js"></script>
  <script src="./agent-results.js"></script>
  <script src="./app.js"></script>
</body>
</html>

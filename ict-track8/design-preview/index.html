<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>问数工作台 · 界面预览</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="app-shell" id="app-shell">
    <div class="mobile-scrim" id="mobile-scrim" hidden></div>

    <aside class="sidebar" id="sidebar" aria-label="会话导航">
      <div class="sidebar-head">
        <div class="brand-lockup"><span class="brand-symbol" aria-hidden="true">问</span><span class="brand-name">问数工作台</span></div>
        <button class="icon-button desktop-only" id="collapse-sidebar" type="button" aria-label="收起侧边栏" title="收起侧边栏"><i data-lucide="panel-left-close" aria-hidden="true">≡</i></button>
        <button class="icon-button mobile-only" id="close-sidebar" type="button" aria-label="关闭导航" title="关闭导航"><i data-lucide="x" aria-hidden="true">×</i></button>
      </div>
      <button class="new-chat" id="new-chat" type="button"><i data-lucide="square-pen" aria-hidden="true">＋</i><span>新建对话</span></button>
      <label class="search-box">
        <i data-lucide="search" aria-hidden="true">⌕</i>
        <span class="sr-only">搜索演示场景</span>
        <input id="scenario-search" type="search" placeholder="搜索会话">
      </label>
      <div class="sidebar-scroll">
        <div class="nav-label">工作区</div>
        <button class="nav-row is-current" id="nav-ask" type="button"><i data-lucide="messages-square" aria-hidden="true">◫</i><span>问数分析</span><span class="nav-current-dot" aria-hidden="true"></span></button>
        <button class="nav-row" id="nav-schema" type="button"><i data-lucide="database" aria-hidden="true">▤</i><span>数据结构</span></button>
        <div class="nav-divider"></div>
        <div class="nav-label">演示会话 <span>5</span></div>
        <div id="scenario-list" class="scenario-list"></div>
      </div>
      <div class="sidebar-bottom">
        <div class="source-icon"><i data-lucide="database-zap" aria-hidden="true">▤</i></div>
        <div class="source-copy"><strong>行业示例库</strong><span>6 张表 · 本地演示</span></div>
        <i data-lucide="chevron-up" class="source-chevron" aria-hidden="true">⌃</i>
      </div>
    </aside>

    <div class="workspace">
      <header class="topbar">
        <div class="topbar-start">
          <button class="icon-button" id="open-sidebar" type="button" aria-label="打开侧边栏" title="打开侧边栏"><i data-lucide="panel-left" aria-hidden="true">≡</i></button>
          <div class="view-title"><strong>问数分析</strong><i data-lucide="chevron-down" aria-hidden="true">⌄</i><span class="title-sub">NL2SQL</span></div>
        </div>
        <div class="topbar-end">
          <span class="demo-badge"><span class="status-dot"></span>演示数据</span>
          <button class="icon-button" id="theme-toggle" type="button" aria-label="切换主题" title="切换主题"><i data-lucide="moon" aria-hidden="true">◐</i></button>
          <button class="icon-button" id="inspector-toggle" type="button" aria-label="切换执行详情" title="切换执行详情"><i data-lucide="panel-right" aria-hidden="true">▥</i></button>
        </div>
      </header>

      <main class="main" id="main">
        <div class="conversation-scroll" id="conversation-scroll">
          <div class="conversation-inner">
            <div class="empty-state" id="empty-state" hidden></div>
            <div class="conversation-meta" id="conversation-meta"><span id="conversation-date">今天</span><span class="meta-separator">·</span><span id="conversation-id">会话 01</span></div>
            <section class="user-turn" id="user-turn" aria-label="用户问题"><div class="user-bubble" id="question-display"></div></section>
            <article class="assistant-turn" id="assistant-turn" aria-label="问数回答">
              <div class="assistant-avatar" aria-hidden="true"><i data-lucide="sparkles">✦</i></div>
              <div class="assistant-body">
                <div class="assistant-heading"><strong>问数工作台</strong><span>基于行业示例库</span></div>
                <button class="reasoning-toggle" id="reasoning-toggle" type="button" aria-expanded="false" aria-controls="reasoning-panel"><i data-lucide="chevron-right" aria-hidden="true">›</i><span id="reasoning-toggle-text">已完成 6 步分析</span><span id="reasoning-time" class="reasoning-time"></span></button>
                <div class="reasoning-panel" id="reasoning-panel" hidden></div>
                <div id="answer-area"></div>
                <div class="response-actions">
                  <button class="action-button" id="copy-answer" type="button" title="复制回答"><i data-lucide="copy" aria-hidden="true">▢</i><span>复制</span></button>
                  <button class="action-button" id="download-csv" type="button" title="下载当前结果"><i data-lucide="download" aria-hidden="true">↓</i><span>导出 CSV</span></button>
                  <span class="answer-stamp" id="answer-stamp"></span>
                </div>
              </div>
            </article>
            <div class="followups" id="followups" aria-label="后续问题"></div>
          </div>
        </div>
        <div class="composer-zone">
          <div class="composer-inner">
            <form class="composer" id="ask-form">
              <label for="question-input" class="sr-only">输入问题</label>
              <textarea id="question-input" rows="1" placeholder="向数据提问" maxlength="1000"></textarea>
              <div class="composer-controls">
                <div class="composer-source"><i data-lucide="database" aria-hidden="true">▤</i>行业示例库 <i data-lucide="chevron-down" aria-hidden="true">⌄</i></div>
                <button class="send-button" id="send-button" type="submit" aria-label="发送问题" title="发送问题"><i data-lucide="arrow-up" aria-hidden="true">↑</i></button>
              </div>
            </form>
            <p class="composer-caption">演示界面 · 不连接数据库或模型</p>
          </div>
        </div>
      </main>
    </div>

    <aside class="inspector" id="inspector" aria-label="NL2SQL 执行详情">
      <div class="inspector-head"><div><span class="inspector-eyebrow">TRACE / 01</span><h2>执行详情</h2></div><button class="icon-button" id="close-inspector" type="button" aria-label="关闭执行详情" title="关闭执行详情"><i data-lucide="panel-right-close" aria-hidden="true">×</i></button></div>
      <div class="inspector-scroll">
        <div class="inspector-summary"><div class="summary-state"><i data-lucide="circle-check" aria-hidden="true">✓</i><span id="trace-state">查询完成</span></div><span id="trace-duration">38 ms</span></div>
        <div class="trace-source"><span>数据源</span><strong>industry_demo.sqlite</strong></div>
        <div class="inspector-section-title">执行流程 <span id="step-count">6 个阶段</span></div>
        <div class="stage-list" id="stage-list"></div>
        <div class="inspector-section-title detail-title">阶段详情</div>
        <div class="stage-detail" id="stage-detail"></div>
        <div class="inspector-section-title lineage-title">字段依据</div>
        <div class="lineage-list" id="lineage-list"></div>
      </div>
      <div class="inspector-foot"><i data-lucide="shield-check" aria-hidden="true">✓</i><span id="inspector-foot-text">只读查询 · 参数化执行</span></div>
    </aside>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
